name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve module version
        id: version
        shell: pwsh
        run: |
          [xml]$module = Get-Content ./Modules/TORCareerUniques/SubModule.xml
          $version = [string]$module.Module.Version.value
          $version = $version.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'SubModule.xml has no module version.' }
          "number=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify source integrity
        shell: pwsh
        run: ./scripts/Verify-Source.ps1
      - name: Restore
        run: dotnet restore TORCareerUniques.sln
      - name: Build
        run: dotnet build TORCareerUniques.sln -c Release --no-restore
      - name: Package
        shell: pwsh
        run: ./scripts/Pack-Release.ps1 -Configuration Release -Version '${{ steps.version.outputs.number }}' -SkipBuild
      - name: Upload validated packages
        uses: actions/upload-artifact@v4
        with:
          name: TOR-Career-Uniques-v${{ steps.version.outputs.number }}
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
            SOURCE_MANIFEST.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TOR Career Uniques ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
