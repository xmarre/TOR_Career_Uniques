name: Apply modified magic-item background fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply source wiring and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          lifecycle = root / 'src/TORCareerUniques/TorMagicItemLifecycleFix.cs'
          raw = lifecycle.read_bytes()
          crlf = b'\r\n' in raw
          text = raw.decode('utf-8').replace('\r\n', '\n')

          initialize_old = '''        internal static void Initialize()
          {
              if (_installed)
          '''
          initialize_new = '''        internal static void Initialize()
          {
              TorMagicItemInventoryClassificationFix.Initialize();
              if (_installed)
          '''
          if 'TorMagicItemInventoryClassificationFix.Initialize();' not in text:
              if initialize_old not in text:
                  raise RuntimeError('TorMagicItemLifecycleFix.Initialize anchor was not found.')
              text = text.replace(initialize_old, initialize_new, 1)

          reset_old = '''            _encounterTypeForLootRoster = null;
              _pendingLootRosterProperty = null;
          }

          private static void ClearRecoveryStateLocked()
          '''
          reset_new = '''            _encounterTypeForLootRoster = null;
              _pendingLootRosterProperty = null;
              TorMagicItemInventoryClassificationFix.ResetSession();
          }

          private static void ClearRecoveryStateLocked()
          '''
          if 'TorMagicItemInventoryClassificationFix.ResetSession();' not in text:
              if reset_old not in text:
                  raise RuntimeError('TorMagicItemLifecycleFix.ResetSession anchor was not found.')
              text = text.replace(reset_old, reset_new, 1)

          newline = '\r\n' if crlf else '\n'
          lifecycle.write_bytes(text.replace('\n', newline).encode('utf-8'))

          documentation = {
              'CHANGELOG.md': (
                  "- Fixed recycled TOR inventory rows retaining the magic-item background after being rebound to an ordinary item by restoring Bannerlord's current native row brush before TOR evaluates the active item.\n",
                  "- Fixed TOR inventory magic-item detection for items carrying a separately rolled loot modifier, including Warden's Spear of the Wild Hunt, so they retain the purple background while unequipped.\n"
              ),
              'RELEASE_NOTES.md': (
                  "- Fixes ordinary inventory rows inheriting TOR's magic-item background when Gauntlet recycles a row previously used for a magic item.\n",
                  "- Fixes magic items with separately rolled loot modifiers, including Warden's Spear of the Wild Hunt, losing the purple background while shown as unequipped inventory rows.\n"
              )
          }
          for relative, (anchor, addition) in documentation.items():
              path = root / relative
              value = path.read_text(encoding='utf-8')
              if addition not in value:
                  if anchor not in value:
                      raise RuntimeError(f'{relative} insertion anchor was not found.')
                  value = value.replace(anchor, anchor + addition, 1)
                  path.write_text(value, encoding='utf-8', newline='\n')

          workflow = root / '.github/workflows/apply-modified-magic-background-fix.yml'
          workflow.unlink()

          entries = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'SOURCE_MANIFEST.sha256':
                  continue
              if relative.split('/', 1)[0] in {'.git', 'artifacts'}:
                  continue
              entries.append((relative, path))
          entries.sort(key=lambda entry: entry[0])
          manifest = '\n'.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + relative
              for relative, path in entries
          ) + '\n'
          (root / 'SOURCE_MANIFEST.sha256').write_text(
              manifest, encoding='ascii', newline='\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix modified magic-item inventory backgrounds'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
