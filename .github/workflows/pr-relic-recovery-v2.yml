name: Apply multi-character relic recovery correction

# Trigger revision 7
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 0
      - name: Execute bounded correction
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/apply-relic-recovery-v2.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = '      - name: Apply bounded source corrections\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Commit corrected implementation\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          old = "assert relic.count(audit_class) == 1\nrelic = relic.replace(audit_class, occurrence_class)"
          new = "relic, count = re.subn(r'        private sealed class PendingGrantAudit\\n        \\{.*?        \\}\\n', occurrence_class, relic, count=1, flags=re.S)\nassert count == 1, 'pending audit class was not replaced exactly once'"
          if old not in code:
              raise RuntimeError('Expected pending-audit replacement block is absent.')
          code = code.replace(old, new)

          old = "assert relic.count(old_tick) == 1\nrelic = relic.replace(old_tick, new_tick)"
          new = "relic, count = re.subn(r'                if \\(restored\\)\\n                \\{.*?                \\}\\n                else if \\(audit\\.Attempts >= 3\\)', new_tick + '                else if (audit.Attempts >= 3)', relic, count=1, flags=re.S)\nassert count == 1, 'restored audit branch was not replaced exactly once'"
          if old not in code:
              raise RuntimeError('Expected audit-log replacement block is absent.')
          code = code.replace(old, new)

          old = """relic, count = re.subn(
    r'        internal static void RepairFromMcm\\(\\).*?        private static string DescribeItem',
    repair_block,
    relic,
    flags=re.S)
assert count == 1, 'repair implementation was not replaced exactly once'"""
          new = """repair_start = relic.index('        internal static void RepairFromMcm()')
repair_marker = '        private static string DescribeItem'
repair_end = relic.index(repair_marker, repair_start)
relic = relic[:repair_start] + repair_block + relic[repair_end + len(repair_marker):]"""
          if old not in code:
              raise RuntimeError('Expected repair implementation replacement block is absent.')
          code = code.replace(old, new)

          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})
          for path in Path('.patch').glob('*') if Path('.patch').exists() else []:
              path.unlink()
          if Path('.patch').exists():
              Path('.patch').rmdir()
          for temporary in (
              '.github/workflows/trigger-relic-recovery-v2.yml',
              '.github/workflows/pr-relic-recovery-v2.yml'):
              candidate = Path(temporary)
              if candidate.exists():
                  candidate.unlink()
      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct multi-character relic recovery and MCM placement"
          git push origin HEAD:fix/multichar-relic-recovery-v2
