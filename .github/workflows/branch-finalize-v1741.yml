name: Branch finalize v1.7.41

on:
  push:
    branches: [fix/multichar-relic-recovery-v2]
    paths:
      - .github/workflows/branch-finalize-v1741.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 0
      - name: Finalize release branch
        shell: bash
        env:
          CLEAN_MAIN: 67ee22eaec9346cedffb994805d932a692dbc4c7
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          def read(p):
              raw=p.read_bytes(); return raw.decode('utf-8-sig').replace('\r\n','\n'), ('\r\n' if b'\r\n' in raw else '\n')
          def write(p,t,nl): p.write_bytes(t.replace('\r\n','\n').replace('\n',nl).encode('utf-8'))

          p=root/'src/TORCareerUniques/RelicRewardIntegrity.cs'
          if p.exists(): p.unlink()

          p=root/'Modules/TORCareerUniques/SubModule.xml'; t,nl=read(p)
          t,n=re.subn(r'\n\s*<SubModule>\s*\n\s*<Name value="TOR Career Uniques - Relic Reward Integrity" />\s*\n\s*<DLLName value="TORCareerUniques\.dll" />\s*\n\s*<SubModuleClassType value="TORCareerUniques\.RelicRewardIntegritySubModule" />\s*\n\s*<Tags />\s*\n\s*</SubModule>','',t,count=1)
          if n!=1: raise RuntimeError('submodule cleanup failed')
          write(p,t,nl)

          p=root/'src/TORCareerUniques/ModInfrastructure.cs'; t,nl=read(p)
          t,n=re.subn(r'\n\s*private static readonly Action RepairMissingRecoveredRelicsAction =\s*\n\s*RelicRewardIntegrity\.RepairFromMcm;','',t,count=1)
          if n!=1: raise RuntimeError('action cleanup failed')
          old='public override int UIVersion { get { return 11; } }'
          if old not in t: raise RuntimeError('UIVersion marker missing')
          t=t.replace(old,'public override int UIVersion { get { return 10; } }',1)
          t,n=re.subn(r'\n\s*\[SettingPropertyButton\("Repair missing recovered relics".*?public Action RepairMissingRecoveredRelics\s*\n\s*\{\s*\n\s*get \{ return RepairMissingRecoveredRelicsAction; \}\s*\n\s*set \{ \}\s*\n\s*\}','',t,count=1,flags=re.S)
          if n!=1: raise RuntimeError('MCM cleanup failed')
          write(p,t,nl)

          p=root/'CHANGELOG.md'; t,nl=read(p); marker='## 1.7.40\n'
          if marker not in t: raise RuntimeError('changelog marker missing')
          t='''## 1.7.41

- Fixed TOR magic items with separately rolled loot modifiers, including Warden's Spear of the Wild Hunt, missing the purple magic-item background while unequipped.
- Applied the inventory-row magic brush from the actual registered runtime item instead of TOR's broken combined item-and-modifier string classification.
- Fixed recycled inventory rows retaining the purple magic-item background after being rebound to an ordinary item.
- Prevented TOR's weekly magical-loot cleanup from unregistering runtime items that are still referenced by inventories, equipment, stashes, settlement storage, or pending loot.
- Re-registered already-affected referenced runtime items before Bannerlord resolves a missing thumbnail, preventing TOR magic-item icons from disappearing permanently after cache eviction.
- Prevented persistent encounter heroes from being captured through direct `TakePrisonerAction` paths and released encounter heroes already stuck in captivity so their normal recovery lifecycle can resume.
- Added no campaign-map polling; cleanup ownership references are collected once per TOR weekly cleanup pass and queried in constant time for each candidate.

'''+t[t.index(marker):]
          write(p,t,nl)

          p=root/'RELEASE_NOTES.md'; _,nl=read(p)
          write(p,'''## TOR Career Uniques v1.7.41

- Fixes TOR magic items with separately rolled loot modifiers, including Warden's Spear of the Wild Hunt, losing the purple magic-item background while unequipped.
- Resolves the inventory row from the actual registered runtime item and applies TOR's magic brush directly, while preserving native unusable-item styling.
- Fixes ordinary inventory rows retaining a purple background when Gauntlet recycles a row previously used for a magic item.
- Prevents TOR's weekly magical-loot cleanup from unregistering runtime items that remain referenced by inventories, equipment, stashes, settlement storage, or pending loot.
- Repairs icons already affected by unsafe cleanup when Bannerlord next requests the referenced runtime item's thumbnail.
- Prevents persistent encounter heroes from becoming stuck as prisoners and releases encounter heroes already captive in existing saves so normal encounter recovery can continue.
- Retains the v1.7.40 lore-affinity and encounter-strength fixes and all earlier companion-set, load-time, and Grey Lord/Cowl fixes.

Install by completely deleting the old `Modules/TORCareerUniques` folder, then extract the clean archive into the Bannerlord root directory.
''',nl)

          for q in [root/'.github/workflows/finalize-v1.7.41.yml',root/'.github/workflows/branch-finalize-v1741.yml']:
              if q.exists(): q.unlink()
          PY

          git checkout "$CLEAN_MAIN" -- .github/workflows/build-release.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.'); entries=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              r=p.relative_to(root).as_posix()
              if r=='SOURCE_MANIFEST.sha256' or r.split('/',1)[0] in {'.git','artifacts'}: continue
              entries.append((r,p))
          entries.sort()
          (root/'SOURCE_MANIFEST.sha256').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+r for r,p in entries)+'\n',encoding='ascii',newline='\n')
          PY
          ! grep -R -n --exclude-dir=.git --exclude='SOURCE_MANIFEST.sha256' -E 'RelicRewardIntegrity|Repair missing recovered relics|repair_orphaned_relic_rewards' .
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v1.7.41 release scope'
          git push origin HEAD:fix/multichar-relic-recovery-v2
