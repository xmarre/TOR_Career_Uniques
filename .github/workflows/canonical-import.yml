name: Diagnose canonical payload

on:
  push:
    branches:
      - agent/canonical-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find valid canonical archive
        shell: python
        run: |
          import base64
          import hashlib
          import itertools
          import lzma
          import pathlib
          import tarfile

          root = pathlib.Path('.')
          fixed = [root / '.canonical-source' / f'part.{i:03d}' for i in range(5)]
          extras = [
              root / '.canonical-source-tail' / 'part.000',
              root / '.canonical-source-after6' / 'part.000',
              root / '.canonical-source-rest' / 'part.000',
              root / '.canonical' / 'part.000',
          ]
          candidates = fixed + extras
          for path in candidates:
              data = ''.join(path.read_text(encoding='utf-8').split())
              print(f'{path}: {len(data)} chars prefix={data[:12]} suffix={data[-12:]}')

          expected = 'c72ac5bef80c6c7c0f6d112c04c4dfd904ec0f4bebeb185edb9a707aca21b780'
          fixed_text = [''.join(p.read_text(encoding='utf-8').split()) for p in fixed]
          found = False
          for count in range(0, len(extras) + 1):
              for order in itertools.permutations(extras, count):
                  texts = fixed_text + [''.join(p.read_text(encoding='utf-8').split()) for p in order]
                  joined = ''.join(texts)
                  try:
                      raw = base64.b64decode(joined, validate=True)
                  except Exception:
                      continue
                  if not raw.startswith(b'\xfd7zXZ\x00'):
                      continue
                  digest = hashlib.sha256(raw).hexdigest()
                  print('XZ candidate:', [str(p) for p in fixed + list(order)], len(raw), digest)
                  try:
                      decompressed = lzma.decompress(raw)
                  except Exception as exc:
                      print('XZ decompression failed:', exc)
                      continue
                  print('VALID XZ:', [str(p) for p in fixed + list(order)], 'tar bytes', len(decompressed))
                  pathlib.Path('/tmp/canonical.tar.xz').write_bytes(raw)
                  with tarfile.open('/tmp/canonical.tar.xz', 'r:xz') as archive:
                      names = archive.getnames()
                  print('Archive entries:', len(names))
                  print('\n'.join(names[:80]))
                  if digest == expected:
                      print('EXPECTED ARCHIVE FOUND')
                  found = True
          if not found:
              raise SystemExit('No valid XZ archive could be reconstructed from the committed fragments.')
