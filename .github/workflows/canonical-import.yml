name: Diagnose canonical payload

on:
  push:
    branches:
      - agent/canonical-import
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find valid canonical archive
        shell: python
        run: |
          import base64
          import hashlib
          import itertools
          import json
          import lzma
          import pathlib
          import tarfile

          root = pathlib.Path('.')
          fixed = [root / '.canonical-source' / f'part.{i:03d}' for i in range(5)]
          extras = [
              root / '.canonical-source-tail' / 'part.000',
              root / '.canonical-source-after6' / 'part.000',
              root / '.canonical-source-rest' / 'part.000',
              root / '.canonical' / 'part.000',
          ]
          candidates = fixed + extras
          report = {'files': {}, 'valid': []}
          for path in candidates:
              data = ''.join(path.read_text(encoding='utf-8').split())
              report['files'][str(path)] = {
                  'characters': len(data),
                  'prefix': data[:16],
                  'suffix': data[-16:],
                  'sha256_text': hashlib.sha256(data.encode()).hexdigest(),
              }

          fixed_text = [''.join(p.read_text(encoding='utf-8').split()) for p in fixed]
          for count in range(0, len(extras) + 1):
              for order in itertools.permutations(extras, count):
                  joined = ''.join(fixed_text + [''.join(p.read_text(encoding='utf-8').split()) for p in order])
                  try:
                      raw = base64.b64decode(joined, validate=True)
                  except Exception:
                      continue
                  if not raw.startswith(b'\xfd7zXZ\x00'):
                      continue
                  candidate = {
                      'order': [str(p) for p in fixed + list(order)],
                      'archive_bytes': len(raw),
                      'archive_sha256': hashlib.sha256(raw).hexdigest(),
                  }
                  try:
                      decompressed = lzma.decompress(raw)
                      candidate['tar_bytes'] = len(decompressed)
                      pathlib.Path('/tmp/candidate.tar.xz').write_bytes(raw)
                      with tarfile.open('/tmp/candidate.tar.xz', 'r:xz') as archive:
                          names = archive.getnames()
                      candidate['entries'] = len(names)
                      candidate['first_entries'] = names[:100]
                  except Exception as exc:
                      candidate['error'] = repr(exc)
                  report['valid'].append(candidate)

          pathlib.Path('payload-diagnosis.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps({'file_count': len(report['files']), 'valid_count': len(report['valid'])}))
      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: payload-diagnosis
          path: payload-diagnosis.json
          if-no-files-found: error
