name: Temporary shared-clan source runner

on:
  push:
    branches: [agent/collapse-encounter-clans]
    paths:
      - '.github/shared-clan-v1738.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Execute staged applicator and tighten leader invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-shared-clan-v1738.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |')
          body = []
          for line in lines[start + 1:]:
              if not line.startswith('          '):
                  break
              body.append(line[10:])
          Path('/tmp/apply-v1738.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-v1738.sh

          python - <<'PY'
          from pathlib import Path
          path = Path('src/TORCareerUniques/SharedEncounterClanRuntime.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            if (!Object.ReferenceEquals(hero.Clan, sharedClan))
                          hero.Clan = sharedClan;
          
                      Hero currentLeader = sharedClan.Leader;
                      if (currentLeader == null || currentLeader.IsDead ||
                          !Object.ReferenceEquals(currentLeader.Clan, sharedClan) ||
                          Object.ReferenceEquals(currentLeader.CompanionOf,
                              Clan.PlayerClan))
                      {
                          sharedClan.SetLeader(hero);
                      }
          '''
          new = '''            // SetLeader establishes the leader before Hero.Clan dispatches
                      // OnHeroChangedClan, preserving the native conversation invariant.
                      sharedClan.SetLeader(hero);
          '''
          if old not in text:
              raise SystemExit('Shared-clan attachment invariant target not found')
          text = text.replace(old, new, 1)
          old_migration = '''                    hero.Clan = sharedClan;
                              movedHeroes++;
          '''
          new_migration = '''                    sharedClan.SetLeader(hero);
                              movedHeroes++;
          '''
          if old_migration not in text:
              raise SystemExit('Legacy hero migration target not found')
          text = text.replace(old_migration, new_migration, 1)
          path.write_text(text, encoding='utf-8', newline='\r\n')
          PY

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw in files:
              if not raw:
                  continue
              name = raw.decode('utf-8')
              if name == 'SOURCE_MANIFEST.sha256':
                  continue
              lines.append(hashlib.sha256(Path(name).read_bytes()).hexdigest() + '  ' + name)
          Path('SOURCE_MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          git add src/TORCareerUniques/SharedEncounterClanRuntime.cs SOURCE_MANIFEST.sha256
          git commit -m "Preserve shared encounter clan leader invariant"
          git push origin HEAD:agent/collapse-encounter-clans
