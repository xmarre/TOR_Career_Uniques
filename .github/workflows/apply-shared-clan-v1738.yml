name: Apply shared encounter clan v1.7.38

on:
  push:
    branches: [agent/collapse-encounter-clans]
    paths:
      - '.github/shared-clan-v1738.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply final source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          root = Path('.')
          code = base64.b64decode('...TRUNCATED...')
          (root / 'src/TORCareerUniques/SharedEncounterClanRuntime.cs').write_bytes(code)

          infra = root / 'src/TORCareerUniques/ModInfrastructure.cs'
          raw = infra.read_bytes()
          replacements = [
              (b'[assembly: AssemblyVersion("1.7.37.0")]',
               b'[assembly: AssemblyVersion("1.7.38.0")]'),
              (b'[assembly: AssemblyFileVersion("1.7.37.0")]',
               b'[assembly: AssemblyFileVersion("1.7.38.0")]'),
              (b'TOR Career Uniques v1.7.37 loaded. Pre-session load guard, early trait registration, and campaign-map-gated encounter maintenance active.', b'TOR Career Uniques v1.7.38 loaded. Shared encounter-clan migration, pre-session profiling, and campaign-map-gated maintenance active.'),
          ]
          for old, new in replacements:
              if old not in raw:
                  raise SystemExit('Missing ModInfrastructure replacement: ' + old.decode())
              raw = raw.replace(old, new, 1)
          infra.write_bytes(raw)

          submodule = root / 'Modules/TORCareerUniques/SubModule.xml'
          text = submodule.read_text(encoding='utf-8')
          text = text.replace('<Version value="v1.7.37" />',
                              '<Version value="v1.7.38" />', 1)
          anchor = '''    <SubModule>
              <Name value="TOR Career Uniques - Pre-Session Load Guard" />'''
          block = '''    <SubModule>
              <Name value="TOR Career Uniques - Shared Encounter Clan" />
              <DLLName value="TORCareerUniques.dll" />
              <SubModuleClassType value="TORCareerUniques.SharedEncounterClanSubModule" />
              <Tags />
            </SubModule>
            <SubModule>
              <Name value="TOR Career Uniques - Pre-Session Load Guard" />'''
          if anchor not in text:
              raise SystemExit('SubModule insertion anchor missing')
          text = text.replace(anchor, block, 1)
          submodule.write_text(text, encoding='utf-8', newline='\n')

          changelog = root / 'CHANGELOG.md'
          old_changelog = changelog.read_text(encoding='utf-8')
          if old_changelog.startswith('## 1.7.38'):
              raise SystemExit('v1.7.38 changelog already exists')
          changelog.write_text('## 1.7.38\n\n- Replaced the 22 serialized per-career encounter clans with one shared leader-backed encounter clan.\n- Existing saves migrate every encounter hero and active encounter party to the shared clan, then remove only legacy clans verified to have no remaining heroes, parties, or settlements.\n- The first load of an old save still deserializes its legacy faction graph; save once after migration so subsequent loads contain only one TORCU encounter clan.\n- Preserved conversation-safe leadership, party-specific cultural affinity, forced hostility, recruitment, successors, and the Grey Lord/Cowl load repair.\n- Added no campaign-map polling, per-frame scans, or recurring clan migration work.\n\n' + old_changelog,
                               encoding='utf-8', newline='\n')

          (root / 'RELEASE_NOTES.md').write_text(
              '## TOR Career Uniques v1.7.38\n\n- Collapses the 22 legacy serialized encounter factions into one shared leader-backed encounter clan.\n- Preserves independent encounter heroes, conversation safety, per-career party affinity, hostility, recruitment, and successors.\n- Existing saves are migrated after their first successful v1.7.38 load. Save the campaign once, then reload to measure the reduced native object-graph load time.\n- Legacy clans are destroyed only after all heroes and active parties have been moved and the clan is verified empty.\n- Retains the Grey Lord/Cowl repair, companion-set support, early TOR trait registration, and deferred encounter maintenance.\n\nInstall by completely deleting the old `Modules/TORCareerUniques` folder, then extract the clean archive into the Bannerlord root directory.\n', encoding='utf-8', newline='\n')
          PY

          git rm -f .github/workflows/apply-shared-clan-v1738.yml
          git rm -f .github/shared-clan-v1738.trigger

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          files = subprocess.check_output(
              ['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw_name in files:
              if not raw_name:
                  continue
              name = raw_name.decode('utf-8')
              if name == 'SOURCE_MANIFEST.sha256':
                  continue
              data = Path(name).read_bytes()
              lines.append(hashlib.sha256(data).hexdigest() + '  ' + name)
          Path('SOURCE_MANIFEST.sha256').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Collapse encounter clans into shared faction"
          git push origin HEAD:agent/collapse-encounter-clans
