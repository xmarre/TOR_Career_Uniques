name: Apply companion review cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/companion-set-bonuses'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed cleanup atomically
        shell: bash
        run: |
          set -euo pipefail
          patch_file=.github/companion-review-cleanup.patch
          workflow_file=.github/workflows/apply-companion-review-cleanup.yml

          test -f "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -f "$patch_file" "$workflow_file"

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('.')
          manifest = root / 'SOURCE_MANIFEST.sha256'
          excluded_roots = {'.git', 'artifacts'}
          entries = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.as_posix()
              if relative == manifest.as_posix():
                  continue
              if relative.split('/', 1)[0] in excluded_roots:
                  continue
              entries.append((relative, sha256(path.read_bytes()).hexdigest()))
          entries.sort()
          manifest.write_text(''.join(f'{digest}  {relative}\n' for relative, digest in entries), encoding='utf-8', newline='\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Address final companion runtime review feedback'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
