name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Validate release version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [xml]$module = Get-Content ./Modules/TORCareerUniques/SubModule.xml
          $version = ([string]$module.Module.Version.value).TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'SubModule.xml has no module version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match module version 'v$version'."
          }
          if ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $subject = (([string]$env:COMMIT_MESSAGE -split "`r?`n", 2)[0]).Trim()
            if ($subject.StartsWith('Release v') -and $subject -ne "Release v$version") {
              throw "Release commit '$subject' does not match module version 'v$version'."
            }
          }
      - name: Verify and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./artifacts/logs | Out-Null
          try {
            & ./scripts/Build.ps1 -Configuration Release *>&1 | Tee-Object -FilePath ./artifacts/logs/build.log
          }
          catch {
            $_ | Out-String | Tee-Object -FilePath ./artifacts/logs/build.log -Append
            exit 1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TORCareerUniques-build-log
          path: artifacts/logs/build.log
          if-no-files-found: warn
      - name: Package release archives
        shell: pwsh
        run: ./scripts/Pack-Release.ps1 -Configuration Release -SkipBuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TORCareerUniques-release
          path: artifacts/release/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TORCareerUniques-release
          path: artifacts/release
      - name: Publish version tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*<Version value="v\([0-9][0-9.]*\)".*/\1/p' Modules/TORCareerUniques/SubModule.xml)
          test -n "$version"
          tag="v$version"
          commit_subject=$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n '1p' | tr -d '\r')
          test "$commit_subject" = "Release $tag"

          release_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
          fi

          if existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              if [ "$release_exists" = true ]; then
                echo "Release $tag already exists at $existing_sha; duplicate trigger from $GITHUB_SHA is a successful no-op."
                exit 0
              fi
              echo "::error::Tag $tag points to $existing_sha instead of $GITHUB_SHA, and no published release exists."
              exit 1
            fi
          else
            if [ "$release_exists" = true ]; then
              echo "::error::Release $tag exists but its Git tag could not be resolved."
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if [ "$release_exists" = true ]; then
            echo "Release $tag already exists on the expected commit; leaving it unchanged."
          else
            gh release create "$tag" artifacts/release/* --title "TOR Career Uniques $tag" --notes-file RELEASE_NOTES.md --verify-tag
          fi

  finalize-v1741:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 0
      - name: Finalize source and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')

          def read_text(path: Path):
              raw = path.read_bytes()
              newline = '\r\n' if b'\r\n' in raw else '\n'
              return raw.decode('utf-8-sig').replace('\r\n', '\n'), newline

          def write_text(path: Path, text: str, newline: str):
              path.write_bytes(text.replace('\r\n', '\n').replace('\n', newline).encode('utf-8'))

          recovery = root / 'src/TORCareerUniques/RelicRewardIntegrity.cs'
          if recovery.exists():
              recovery.unlink()

          submodule = root / 'Modules/TORCareerUniques/SubModule.xml'
          text, newline = read_text(submodule)
          pattern = re.compile(
              r'\n\s*<SubModule>\s*\n'
              r'\s*<Name value="TOR Career Uniques - Relic Reward Integrity" />\s*\n'
              r'\s*<DLLName value="TORCareerUniques\.dll" />\s*\n'
              r'\s*<SubModuleClassType value="TORCareerUniques\.RelicRewardIntegritySubModule" />\s*\n'
              r'\s*<Tags />\s*\n'
              r'\s*</SubModule>', re.MULTILINE)
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise RuntimeError('Relic Reward Integrity SubModule block was not found exactly once.')
          write_text(submodule, text, newline)

          infra = root / 'src/TORCareerUniques/ModInfrastructure.cs'
          text, newline = read_text(infra)
          text, count = re.subn(
              r'\n\s*private static readonly Action RepairMissingRecoveredRelicsAction =\s*\n'
              r'\s*RelicRewardIntegrity\.RepairFromMcm;', '', text, count=1)
          if count != 1:
              raise RuntimeError('Recovery action field was not found exactly once.')
          old_ui = 'public override int UIVersion { get { return 11; } }'
          new_ui = 'public override int UIVersion { get { return 10; } }'
          if text.count(old_ui) != 1:
              raise RuntimeError('UIVersion 11 marker was not found exactly once.')
          text = text.replace(old_ui, new_ui, 1)
          button_pattern = re.compile(
              r'\n\s*\[SettingPropertyButton\("Repair missing recovered relics".*?'
              r'public Action RepairMissingRecoveredRelics\s*\n\s*\{\s*\n'
              r'\s*get \{ return RepairMissingRecoveredRelicsAction; \}\s*\n'
              r'\s*set \{ \}\s*\n\s*\}', re.DOTALL)
          text, count = button_pattern.subn('', text, count=1)
          if count != 1:
              raise RuntimeError('Recovery MCM button block was not found exactly once.')
          write_text(infra, text, newline)

          changelog = root / 'CHANGELOG.md'
          existing, newline = read_text(changelog)
          marker = '## 1.7.40\n'
          if marker not in existing:
              raise RuntimeError('CHANGELOG 1.7.40 marker was not found.')
          older = existing[existing.index(marker):]
          current = '''## 1.7.41

- Fixed TOR magic items with separately rolled loot modifiers, including Warden's Spear of the Wild Hunt, missing the purple magic-item background while unequipped.
- Applied the inventory-row magic brush from the actual registered runtime item instead of TOR's broken combined item-and-modifier string classification.
- Fixed recycled inventory rows retaining the purple magic-item background after being rebound to an ordinary item.
- Prevented TOR's weekly magical-loot cleanup from unregistering runtime items that are still referenced by inventories, equipment, stashes, settlement storage, or pending loot.
- Re-registered already-affected referenced runtime items before Bannerlord resolves a missing thumbnail, preventing TOR magic-item icons from disappearing permanently after cache eviction.
- Prevented persistent encounter heroes from being captured through direct `TakePrisonerAction` paths and released encounter heroes already stuck in captivity so their normal recovery lifecycle can resume.
- Added no campaign-map polling; cleanup ownership references are collected once per TOR weekly cleanup pass and queried in constant time for each candidate.

'''
          write_text(changelog, current + older, newline)

          notes = root / 'RELEASE_NOTES.md'
          _, newline = read_text(notes)
          release_notes = '''## TOR Career Uniques v1.7.41

- Fixes TOR magic items with separately rolled loot modifiers, including Warden's Spear of the Wild Hunt, losing the purple magic-item background while unequipped.
- Resolves the inventory row from the actual registered runtime item and applies TOR's magic brush directly, while preserving native unusable-item styling.
- Fixes ordinary inventory rows retaining a purple background when Gauntlet recycles a row previously used for a magic item.
- Prevents TOR's weekly magical-loot cleanup from unregistering runtime items that remain referenced by inventories, equipment, stashes, settlement storage, or pending loot.
- Repairs icons already affected by unsafe cleanup when Bannerlord next requests the referenced runtime item's thumbnail.
- Prevents persistent encounter heroes from becoming stuck as prisoners and releases encounter heroes already captive in existing saves so normal encounter recovery can continue.
- Retains the v1.7.40 lore-affinity and encounter-strength fixes and all earlier companion-set, load-time, and Grey Lord/Cowl fixes.

Install by completely deleting the old `Modules/TORCareerUniques` folder, then extract the clean archive into the Bannerlord root directory.
'''
          write_text(notes, release_notes, newline)

          temporary = root / '.github/workflows/finalize-v1.7.41.yml'
          if temporary.exists():
              temporary.unlink()

          forbidden = (
              'RelicRewardIntegrity',
              'Repair missing recovered relics',
              'repair_orphaned_relic_rewards',
          )
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'artifacts' in path.parts:
                  continue
              if path.suffix.lower() not in {'.cs', '.xml', '.md', '.yml', '.yaml'}:
                  continue
              if path.as_posix() == '.github/workflows/build-release.yml':
                  continue
              value = path.read_text(encoding='utf-8-sig', errors='replace')
              for token in forbidden:
                  if token in value:
                      raise RuntimeError(f'Forbidden obsolete recovery token {token!r} remains in {path}.')
          PY

          git checkout origin/main -- .github/workflows/build-release.yml

          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          entries = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'SOURCE_MANIFEST.sha256':
                  continue
              if relative.split('/', 1)[0] in {'.git', 'artifacts'}:
                  continue
              entries.append((relative, path))
          entries.sort(key=lambda entry: entry[0])
          manifest = '\n'.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + relative
              for relative, path in entries
          ) + '\n'
          (root / 'SOURCE_MANIFEST.sha256').write_text(
              manifest, encoding='ascii', newline='\n')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v1.7.41 release scope'
          git push origin HEAD:fix/multichar-relic-recovery-v2
