name: Normalize v1.7.41 tracked release outputs

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 20
      - name: Normalize tracked outputs and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-artifact /tmp/release-clean
          mkdir -p /tmp/release-artifact /tmp/release-clean
          gh run download 30775264795 --repo "$GITHUB_REPOSITORY" --name TORCareerUniques-release --dir /tmp/release-artifact
          clean_zip=$(find /tmp/release-artifact -maxdepth 1 -type f -name '*_CLEAN.zip' -print -quit)
          test -n "$clean_zip"
          unzip -q "$clean_zip" -d /tmp/release-clean
          source_bin=/tmp/release-clean/Modules/TORCareerUniques/bin/Win64_Shipping_Client
          target_bin=Modules/TORCareerUniques/bin/Win64_Shipping_Client
          mkdir -p "$target_bin"
          cp -f "$source_bin"/*.dll "$target_bin"/
          cp -f "$source_bin"/*.deps.json "$target_bin"/
          python - <<'PY'
          from pathlib import Path
          for path in Path('Modules/TORCareerUniques/bin/Win64_Shipping_Client').glob('*.deps.json'):
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git show bc3fb8aba99ee7ff5f3b0790efd9b082b6fd7cc8:.github/workflows/build-release.yml > .github/workflows/build-release.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          entries = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'SOURCE_MANIFEST.sha256':
                  continue
              if relative.split('/', 1)[0] in {'.git', 'artifacts'}:
                  continue
              entries.append((relative, path))
          entries.sort(key=lambda entry: entry[0])
          lines = [
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + relative
              for relative, path in entries
          ]
          (root / 'SOURCE_MANIFEST.sha256').write_text(
              '\n'.join(lines) + '\n', encoding='ascii', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f Modules/TORCareerUniques/bin/Win64_Shipping_Client/*
          git commit -m 'Normalize v1.7.41 tracked release outputs'
          git push origin HEAD:fix/multichar-relic-recovery-v2
