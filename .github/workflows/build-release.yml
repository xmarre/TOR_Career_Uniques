name: Normalize tracked v1.7.41 dependency manifests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 10
      - name: Normalize tracked dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('Modules/TORCareerUniques/bin/Win64_Shipping_Client')
          for path in sorted(root.glob('*.deps.json')):
              text = path.read_text(encoding='utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git show c1233b9330c2ec32e99ce4e0761798cb07edd688:.github/workflows/build-release.yml > .github/workflows/build-release.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          entries = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'SOURCE_MANIFEST.sha256':
                  continue
              if relative.split('/', 1)[0] in {'.git', 'artifacts'}:
                  continue
              entries.append((relative, path))
          entries.sort(key=lambda entry: entry[0])
          lines = [
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + relative
              for relative, path in entries
          ]
          (root / 'SOURCE_MANIFEST.sha256').write_text(
              '\n'.join(lines) + '\n', encoding='ascii', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f Modules/TORCareerUniques/bin/Win64_Shipping_Client/*.deps.json
          git commit -m 'Normalize tracked v1.7.41 dependency manifests'
          git push origin HEAD:fix/multichar-relic-recovery-v2
