name: Apply v1.7.41 source through PR workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 10
      - name: Apply stored payload and restore release workflow
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/build-release.yml > /tmp/original-build-release.yml
          git show 658d5a3361b775934d68423e98a6b844e81e5c4e:.github/workflows/apply-v1.7.41.yml > /tmp/payload-workflow.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/payload-workflow.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply release source atomically'
          start = lines.index(marker)
          run = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run + 1:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          script = '\n'.join(body) + '\n'
          needle = 'rm .github/workflows/apply-v1.7.41.yml\n'
          replacement = needle + 'cp /tmp/original-build-release.yml .github/workflows/build-release.yml\n'
          if needle not in script:
              raise SystemExit('payload cleanup marker not found')
          script = script.replace(needle, replacement, 1)
          Path('/tmp/apply-v1741.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-v1741.sh
