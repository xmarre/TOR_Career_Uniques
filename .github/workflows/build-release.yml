name: Regenerate exact v1.7.41 manifest

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 10
      - name: Regenerate source manifest from the checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          git show b8098255204955456bf0768b0a853ba27c5dcadd:.github/workflows/build-release.yml > /tmp/current-workflow.yml
          git show 34f37c4ebc8122cad7218823e70112b52af0b07b:.github/workflows/build-release.yml > .github/workflows/build-release.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          entries = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'SOURCE_MANIFEST.sha256':
                  continue
              if relative.split('/', 1)[0] in {'.git', 'artifacts'}:
                  continue
              entries.append((relative, path))
          entries.sort(key=lambda entry: entry[0])
          lines = [
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + relative
              for relative, path in entries
          ]
          (root / 'SOURCE_MANIFEST.sha256').write_text(
              '\n'.join(lines) + '\n', encoding='ascii', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-release.yml SOURCE_MANIFEST.sha256
          git commit -m 'Regenerate exact v1.7.41 source manifest'
          git push origin HEAD:fix/multichar-relic-recovery-v2
