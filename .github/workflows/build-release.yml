name: Synchronize final v1.7.41 binaries

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multichar-relic-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 10
      - name: Commit final deterministic Release outputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-artifact /tmp/release-clean
          mkdir -p /tmp/release-artifact /tmp/release-clean
          gh run download 30776748803 --repo "$GITHUB_REPOSITORY" --name TORCareerUniques-release --dir /tmp/release-artifact
          clean_zip=$(find /tmp/release-artifact -maxdepth 1 -type f -name '*_CLEAN.zip' -print -quit)
          test -n "$clean_zip"
          unzip -q "$clean_zip" -d /tmp/release-clean
          source_bin=/tmp/release-clean/Modules/TORCareerUniques/bin/Win64_Shipping_Client
          target_bin=Modules/TORCareerUniques/bin/Win64_Shipping_Client
          test -f "$source_bin/TORCareerUniques.dll"
          test -f "$source_bin/TORCareerUniques.UIIconPassThrough.dll"
          mkdir -p "$target_bin"
          rm -f "$target_bin"/*
          cp -f "$source_bin"/* "$target_bin"/
          git show 46d72b385d7efe8bf50fcc622c930425e57b318c:.github/workflows/build-release.yml > .github/workflows/build-release.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          entries = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'SOURCE_MANIFEST.sha256':
                  continue
              if relative.split('/', 1)[0] in {'.git', 'artifacts'}:
                  continue
              entries.append((relative, path))
          entries.sort(key=lambda entry: entry[0])
          lines = [
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + relative
              for relative, path in entries
          ]
          (root / 'SOURCE_MANIFEST.sha256').write_text(
              '\n'.join(lines) + '\n', encoding='ascii', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f Modules/TORCareerUniques/bin/Win64_Shipping_Client/*
          git commit -m 'Synchronize final v1.7.41 release binaries'
          git push origin HEAD:fix/multichar-relic-recovery-v2
