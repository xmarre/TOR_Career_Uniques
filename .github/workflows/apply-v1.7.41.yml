name: Apply v1.7.41 source

on:
  push:
    branches:
      - fix/multichar-relic-recovery-v2
    paths:
      - .github/workflows/apply-v1.7.41.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/multichar-relic-recovery-v2
          fetch-depth: 2
      - name: Run payload stored in parent commit
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/apply-v1.7.41.yml > /tmp/parent-workflow.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/parent-workflow.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply release source atomically'
          start = lines.index(marker)
          run = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run + 1:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          Path('/tmp/apply-v1741.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-v1741.sh
