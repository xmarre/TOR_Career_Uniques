name: Bootstrap repository rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  rebuild:
    if: github.head_ref == 'repo-rebuild-v1.7.29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-rebuild-v1.7.29
          fetch-depth: 0
      - name: Import canonical repository tree
        shell: bash
        run: |
          set -euo pipefail

          if [ -f TORCareerUniques.sln ] && [ -f SOURCE_MANIFEST.sha256 ] && [ ! -d .import ]; then
            pwsh -NoProfile -File scripts/Verify-Source.ps1
            echo 'Canonical repository tree is already present.'
            exit 0
          fi

          test -d .import
          mapfile -t chunks < <(find .import -maxdepth 1 -type f -name 'chunk-*' | sort)
          test "${#chunks[@]}" -eq 7
          cat "${chunks[@]}" > /tmp/TORCareerUniques-v1.7.29-source.tar.xz
          echo '378982d02743289ee06abdb14555b6c19cfabf259c412adf414ece4f93f9975b  /tmp/TORCareerUniques-v1.7.29-source.tar.xz' | sha256sum --check --strict
          xz --test /tmp/TORCareerUniques-v1.7.29-source.tar.xz

          rm -rf /tmp/torcu-canonical
          mkdir -p /tmp/torcu-canonical
          tar -xJf /tmp/TORCareerUniques-v1.7.29-source.tar.xz -C /tmp/torcu-canonical
          test -f /tmp/torcu-canonical/TORCareerUniques.sln
          test -f /tmp/torcu-canonical/SOURCE_MANIFEST.sha256
          test -f /tmp/torcu-canonical/src/TORCareerUniques/SetItemRuntime.cs
          pwsh -NoProfile -File /tmp/torcu-canonical/scripts/Verify-Source.ps1

          forbidden=$(find /tmp/torcu-canonical -type f \( -iname 'VALIDATION*' -o -iname '*INVESTIGATION*' -o -iname '*PatchCompatibilityFixes*' -o -path '*/bootstrap*/*' -o -path '*/.import/*' \) -print)
          test -z "$forbidden"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/torcu-canonical/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Rebuild repository from v1.7.28 and apply v1.7.29'
          git push origin HEAD:repo-rebuild-v1.7.29
