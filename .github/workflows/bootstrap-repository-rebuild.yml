name: Bootstrap repository rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  analyze:
    if: github.head_ref == 'repo-rebuild-v1.7.29'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-rebuild-v1.7.29
          fetch-depth: 0
      - name: Localize first missing base64 character
        shell: bash
        run: |
          set -euo pipefail
          rm -f .import/diagnostic.txt
          python3 - <<'PY' > .import/diagnostic.txt
          import base64, glob, heapq, lzma, pathlib, string

          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
          allowed = set(alphabet + '=')

          def clean(name):
              raw = pathlib.Path(name).read_text(encoding='utf-8-sig')
              return ''.join(ch for ch in raw if ch in allowed)

          names = sorted(glob.glob('bootstrap2/part.*')) + sorted(glob.glob('bootstrap2/tail.*'))
          pieces = [(name, clean(name)) for name in names]
          joined = ''.join(piece for _, piece in pieces)

          boundaries = {}
          offset = 0
          for name, piece in pieces:
              boundaries[name] = (offset, offset + len(piece))
              offset += len(piece)

          def decode_lenient(text):
              core = text.rstrip('=')
              core += 'A' * ((-len(core)) % 4)
              return base64.b64decode(core, validate=True)

          def score(text, block=256):
              try:
                  data = decode_lenient(text)
              except Exception:
                  return -1
              decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              pos = 0
              try:
                  while pos < len(data):
                      end = min(pos + block, len(data))
                      decoder.decompress(data[pos:end])
                      pos = end
                      if decoder.eof:
                          return len(data) + 10_000_000
              except lzma.LZMAError:
                  return pos
              return len(data)

          baseline = score(joined, block=16)
          center = baseline * 4 // 3
          lo_bound, hi_bound = boundaries['bootstrap2/tail.001']
          coarse_lo = max(lo_bound, center - 2048)
          coarse_hi = min(hi_bound, center + 192)

          print('phase=first-missing-character')
          print(f'joined_length={len(joined)} baseline_input_score={baseline} mapped_base64_center={center}')
          print(f'tail001_boundary={lo_bound}..{hi_bound} search={coarse_lo}..{coarse_hi}')

          heap = []
          for position in range(coarse_lo, coarse_hi + 1, 4):
              for char in alphabet:
                  candidate = joined[:position] + char + joined[position:]
                  value = score(candidate, block=256)
                  item = (value, position, char)
                  if len(heap) < 24:
                      heapq.heappush(heap, item)
                  elif item > heap[0]:
                      heapq.heapreplace(heap, item)

          coarse = sorted(heap, reverse=True)
          print('coarse_top:')
          for value, position, char in coarse:
              print(f'  score={value} position={position} char={char}')

          refine_positions = set()
          for _, position, _ in coarse[:12]:
              for p in range(max(lo_bound, position - 8), min(hi_bound, position + 8) + 1):
                  refine_positions.add(p)

          heap = []
          for position in sorted(refine_positions):
              for char in alphabet:
                  candidate = joined[:position] + char + joined[position:]
                  value = score(candidate, block=32)
                  item = (value, position, char)
                  if len(heap) < 40:
                      heapq.heappush(heap, item)
                  elif item > heap[0]:
                      heapq.heapreplace(heap, item)

          print('refined_top:')
          for value, position, char in sorted(heap, reverse=True):
              print(f'  score={value} position={position} char={char}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .import/diagnostic.txt
          git commit -m 'Record first transport corruption localization'
          git push origin HEAD:repo-rebuild-v1.7.29
          exit 1
