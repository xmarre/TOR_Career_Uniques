name: Bootstrap repository rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  rebuild:
    if: github.head_ref == 'repo-rebuild-v1.7.29'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: repo-rebuild-v1.7.29
          fetch-depth: 0
      - name: Reconstruct and verify canonical tree
        shell: bash
        run: |
          set -u
          if [ -f .import/diagnostic.txt ]; then
            cat .import/diagnostic.txt
            exit 1
          fi
          fail_import() {
            status="$1"
            shift
            {
              echo "phase=$status"
              printf '%s\n' "$@"
            } > .import/diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .import/diagnostic.txt
            git commit -m "Record canonical import failure: $status"
            git push origin HEAD:repo-rebuild-v1.7.29
            exit 1
          }
          if ! python3 - <<'PY' >/tmp/repair-output.txt 2>&1
          import base64, binascii, glob, hashlib, lzma, pathlib, string
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
          allowed = set(alphabet + '=')
          def clean(name):
              raw = pathlib.Path(name).read_text(encoding='utf-8-sig')
              return ''.join(ch for ch in raw if ch in allowed)
          prefix_names = sorted(glob.glob('bootstrap2/part.*')) + ['bootstrap2/tail.000', 'bootstrap2/tail.001']
          middle_names = ['bootstrap2/tail.002', 'bootstrap2/tail.003', 'bootstrap2/tail.004']
          prefix = ''.join(clean(name) for name in prefix_names)
          middle = ''.join(clean(name) for name in middle_names)
          tail = clean('bootstrap2/tail.005')
          if len(prefix) % 4 != 3 or len(middle) % 4 != 0 or len(tail) % 4 != 2 or not tail.endswith('=='):
              raise RuntimeError(f'unexpected boundary shape: prefix={len(prefix)%4}, middle={len(middle)%4}, tail={len(tail)%4}, tail_padding={tail[-2:]}')
          prefix_candidates = []
          for missing in alphabet:
              text = prefix + missing + middle
              try:
                  data = base64.b64decode(text, validate=True)
                  decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
                  decoder.decompress(data)
              except (binascii.Error, lzma.LZMAError):
                  continue
              prefix_candidates.append((missing, data))
          print('prefix_candidates=' + ''.join(item[0] for item in prefix_candidates))
          if not prefix_candidates:
              raise RuntimeError('no middle-boundary character survived incremental XZ decompression')
          tail_candidates = []
          for first in alphabet:
              for second in alphabet:
                  text = first + second + tail
                  try:
                      data = base64.b64decode(text, validate=True)
                  except binascii.Error:
                      continue
                  tail_candidates.append((first, second, data))
          repaired = []
          attempts = 0
          for middle_char, prefix_bytes in prefix_candidates:
              for first, second, tail_bytes in tail_candidates:
                  attempts += 1
                  payload = prefix_bytes + tail_bytes
                  try:
                      lzma.decompress(payload, format=lzma.FORMAT_XZ)
                  except lzma.LZMAError:
                      continue
                  repaired.append((middle_char, first, second, payload))
          print(f'full_attempts={attempts}')
          if len(repaired) != 1:
              raise RuntimeError(f'expected one XZ-valid boundary repair, found {len(repaired)}')
          middle_char, first, second, payload = repaired[0]
          pathlib.Path('/tmp/TORCareerUniques-source.tar.xz').write_bytes(payload)
          print(f'repaired_missing_chars={middle_char}|{first}{second}')
          print(f'archive_bytes={len(payload)}')
          print(f'archive_sha256={hashlib.sha256(payload).hexdigest()}')
          PY
          then
            fail_import repair "$(cat /tmp/repair-output.txt)"
          fi
          if ! xz --test /tmp/TORCareerUniques-source.tar.xz 2>/tmp/xz-error.txt; then
            fail_import xz "$(cat /tmp/xz-error.txt)" "$(cat /tmp/repair-output.txt)"
          fi
          rm -rf /tmp/torcu-unpack
          mkdir -p /tmp/torcu-unpack
          if ! tar -xJf /tmp/TORCareerUniques-source.tar.xz -C /tmp/torcu-unpack 2>/tmp/tar-error.txt; then
            fail_import extract "$(cat /tmp/tar-error.txt)"
          fi
          source_root=/tmp/torcu-unpack
          if [ ! -f "$source_root/TORCareerUniques.sln" ]; then
            mapfile -t roots < <(find /tmp/torcu-unpack -type f -name TORCareerUniques.sln -printf '%h\n')
            if [ "${#roots[@]}" -ne 1 ]; then
              fail_import root "resolved_roots=${#roots[@]}" "$(find /tmp/torcu-unpack -maxdepth 3 -type f | sort | head -200)"
            fi
            source_root="${roots[0]}"
          fi
          install -m 0644 .import/overrides/Directory.Build.props "$source_root/Directory.Build.props"
          install -m 0644 .import/overrides/Pack-Release.ps1 "$source_root/scripts/Pack-Release.ps1"
          install -m 0644 .import/overrides/build-release.yml "$source_root/.github/workflows/build-release.yml"
          install -m 0644 .import/overrides/SOURCE_MANIFEST.sha256 "$source_root/SOURCE_MANIFEST.sha256"
          if ! pwsh -NoProfile -File "$source_root/scripts/Verify-Source.ps1" >/tmp/verify-output.txt 2>&1; then
            fail_import manifest "$(tail -200 /tmp/verify-output.txt)" "$(cat /tmp/repair-output.txt)"
          fi
          forbidden=$(find "$source_root" -type f \( -iname 'VALIDATION*' -o -iname '*INVESTIGATION*' -o -iname '*PatchCompatibilityFixes*' -o -path '*/.import/*' -o -path '*/bootstrap*/*' \) | sort | head -200)
          if [ -n "$forbidden" ]; then
            fail_import cleanup "$forbidden"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root/." .
          test -f TORCareerUniques.sln || fail_import final-tree 'Missing solution after copy.'
          test -f SOURCE_MANIFEST.sha256 || fail_import final-tree 'Missing source manifest after copy.'
          test -f src/TORCareerUniques/SetItemRuntime.cs || fail_import final-tree 'Missing v1.7.29 source after copy.'
      - name: Commit canonical repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Rebuild repository from v1.7.28 and apply v1.7.29'
          git push origin HEAD:repo-rebuild-v1.7.29
