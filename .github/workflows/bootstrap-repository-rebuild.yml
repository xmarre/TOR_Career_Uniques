name: Bootstrap repository rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  analyze:
    if: github.head_ref == 'repo-rebuild-v1.7.29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-rebuild-v1.7.29
          fetch-depth: 0
      - name: Align surviving transport regions
        shell: bash
        run: |
          set -euo pipefail
          rm -f .import/diagnostic.txt
          python3 - <<'PY' > .import/diagnostic.txt
          import difflib, glob, pathlib, string
          allowed = set(string.ascii_letters + string.digits + '+/=')
          def clean_file(name):
              raw = pathlib.Path(name).read_text(encoding='utf-8-sig')
              return ''.join(ch for ch in raw if ch in allowed)
          def combine(patterns):
              names=[]
              for pattern in patterns:
                  names.extend(sorted(glob.glob(pattern)))
              return ''.join(clean_file(name) for name in names), names
          bootstrap, bootstrap_names = combine(['bootstrap2/part.*','bootstrap2/tail.*'])
          sets = [
              ('source', ['bootstrap/source.part.*']),
              ('segments', ['bootstrap/seg.*']),
              ('minimal', ['bootstrap/min.part.*']),
          ]
          print('phase=overlap')
          print(f'bootstrap2 length={len(bootstrap)}')
          for label, patterns in sets:
              joined, names = combine(patterns)
              exact = bootstrap.find(joined)
              matcher = difflib.SequenceMatcher(None, joined, bootstrap, autojunk=False)
              match = matcher.find_longest_match(0, len(joined), 0, len(bootstrap))
              print(f'{label}: files={names} length={len(joined)} exact_at={exact} longest_candidate={match.a} longest_bootstrap={match.b} longest_length={match.size}')
              for name in names:
                  piece=clean_file(name)
                  exact_piece=bootstrap.find(piece)
                  m=difflib.SequenceMatcher(None,piece,bootstrap,autojunk=False).find_longest_match(0,len(piece),0,len(bootstrap))
                  print(f'  {name}: length={len(piece)} exact_at={exact_piece} longest_piece={m.a} longest_bootstrap={m.b} longest_length={m.size} prefix={piece[:12]} suffix={piece[-12:]}')
          boundaries=[]
          total=0
          for name in bootstrap_names:
              piece=clean_file(name)
              boundaries.append((name,total,total+len(piece)))
              total += len(piece)
          print('bootstrap2 boundaries:')
          for item in boundaries:
              print(f'  {item[0]} {item[1]}..{item[2]}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .import/diagnostic.txt
          git commit -m 'Record transport overlap analysis'
          git push origin HEAD:repo-rebuild-v1.7.29
          exit 1
