name: Apply relic recovery correction

on:
  push:
    branches:
      - fix/relic-reward-inventory-integrity
    paths:
      - .github/workflows/apply-relic-recovery-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/relic-reward-inventory-integrity
          fetch-depth: 0
      - name: Apply bounded source corrections
        shell: python
        run: |
          import base64
          import hashlib
          import pathlib
          import re

          # Compatibility fixture for the already-created one-shot launcher.
          audit_class = (
              "        private sealed class PendingGrantAudit\n"
              "        {\n"
              "        }\n")
          occurrence_class = audit_class
          old_tick = (
              "                if (restored)\n"
              "                {\n"
              "                }\n"
              "                else if (audit.Attempts >= 3)")
          new_tick = old_tick
          repair_block = "        internal static void RepairFromMcm()\n        private static string DescribeItem"
          relic = (audit_class + old_tick + "\n" +
              "        internal static void RepairFromMcm()\n" +
              "        {\n        }\n" +
              "        private static string DescribeItem")
          assert relic.count(audit_class) == 1
          relic = relic.replace(audit_class, occurrence_class)
          assert relic.count(old_tick) == 1
          relic = relic.replace(old_tick, new_tick)
          relic, count = re.subn(
              r'        internal static void RepairFromMcm\(\).*?        private static string DescribeItem',
              repair_block,
              relic,
              flags=re.S)
          assert count == 1, 'repair implementation was not replaced exactly once'

          root = pathlib.Path('.')
          chunk_dir = root / '.patch'
          chunks = sorted(chunk_dir.glob('relic.*'))
          if [path.name for path in chunks] != [f'relic.{i:02d}' for i in range(12)]:
              raise RuntimeError('Recovery source chunks are incomplete or out of order.')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          decoded = base64.b64decode(encoded, validate=True)
          expected = '55de4403425f8435a3d2d548b708586b6836408db4247b094ab5552b96519d0a'
          actual = hashlib.sha256(decoded).hexdigest()
          if actual != expected:
              raise RuntimeError(f'Recovery source hash mismatch: {actual}')

          relic_path = root / 'src/TORCareerUniques/RelicRewardIntegrity.cs'
          mod_path = root / 'src/TORCareerUniques/ModInfrastructure.cs'
          manifest_path = root / 'SOURCE_MANIFEST.sha256'
          relic_path.write_bytes(decoded)

          mod = mod_path.read_text(encoding='utf-8')
          old_version = 'public override int UIVersion { get { return 10; } }'
          if mod.count(old_version) != 1:
              raise RuntimeError('Existing MCM UIVersion anchor was not found exactly once.')
          mod = mod.replace(old_version,
              'public override int UIVersion { get { return 11; } }')

          old_actions = (
              "        private static readonly Action RespawnMissingAction =\n"
              "            AdminBridge.RespawnMissing;\n")
          new_actions = old_actions + (
              "        private static readonly Action RepairMissingRecoveredRelicsAction =\n"
              "            RelicRewardIntegrity.RepairFromMcm;\n")
          if mod.count(old_actions) != 1:
              raise RuntimeError('Existing MCM action anchor was not found exactly once.')
          mod = mod.replace(old_actions, new_actions)

          respawn_button = (
              "        [SettingPropertyButton(\"Respawn missing encounters\", 20, false,\n"
              "            \"Clears cooldowns and immediately recreates every currently missing encounter. Recovered set pieces remain recovered.\", Content = \"Respawn now\")]\n")
          recovery_button = (
              "        [SettingPropertyButton(\"Repair missing recovered relics\", 19, false,\n"
              "            \"Scans every living character, hero equipment set, mobile-party inventory, settlement inventory and stash before restoring anything. Existing relics are never moved. It also removes the single duplicate that the previous faulty recovery build could place in the active main inventory while the original remained on another character.\", Content = \"Repair now\")]\n"
              "        [SettingPropertyGroup(\"Relic Encounters & Testing\", GroupOrder = 2)]\n"
              "        public Action RepairMissingRecoveredRelics\n"
              "        {\n"
              "            get { return RepairMissingRecoveredRelicsAction; }\n"
              "            set { }\n"
              "        }\n\n")
          if mod.count(respawn_button) != 1:
              raise RuntimeError('Existing MCM respawn button anchor was not found exactly once.')
          mod = mod.replace(respawn_button, recovery_button + respawn_button)
          mod_path.write_text(mod, encoding='utf-8', newline='\n')

          manifest = manifest_path.read_text(encoding='utf-8').splitlines()
          changed = {
              'src/TORCareerUniques/RelicRewardIntegrity.cs': relic_path,
              'src/TORCareerUniques/ModInfrastructure.cs': mod_path,
          }
          for relative, path in changed.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              matches = [index for index, line in enumerate(manifest)
                         if line.endswith('  ' + relative)]
              if len(matches) != 1:
                  raise RuntimeError(f'Manifest entry missing or duplicated: {relative}')
              manifest[matches[0]] = digest + '  ' + relative
          manifest_path.write_text('\n'.join(manifest) + '\n', encoding='utf-8')

          for path in chunk_dir.glob('*'):
              path.unlink()
          chunk_dir.rmdir()
          for temporary in (
              '.github/workflows/apply-relic-recovery-v2.yml',
              '.github/workflows/trigger-relic-recovery-v2.yml',
              '.github/workflows/pr-relic-recovery-v2.yml',
              '.github/workflows/pr-relic-recovery-v2c.yml',
          ):
              candidate = root / temporary
              if candidate.exists():
                  candidate.unlink()
          status = root / '.patch-status.log'
          if status.exists():
              status.unlink()
      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct multi-character relic recovery and MCM placement"
          git push origin HEAD:fix/relic-reward-inventory-integrity
