name: Diagnose relic recovery chunks

on:
  push:
    branches:
      - fix/relic-reward-inventory-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/relic-reward-inventory-integrity
          fetch-depth: 0
      - name: Apply bounded source corrections
        shell: python
        run: |
          import hashlib
          import pathlib
          import re

          audit_class = (
              "        private sealed class PendingGrantAudit\n"
              "        {\n"
              "        }\n")
          occurrence_class = audit_class
          old_tick = (
              "                if (restored)\n"
              "                {\n"
              "                }\n"
              "                else if (audit.Attempts >= 3)")
          new_tick = old_tick
          repair_block = "        internal static void RepairFromMcm()\n        private static string DescribeItem"
          relic = (audit_class + old_tick + "\n" +
              "        internal static void RepairFromMcm()\n" +
              "        {\n        }\n" +
              "        private static string DescribeItem")
          assert relic.count(audit_class) == 1
          relic = relic.replace(audit_class, occurrence_class)
          assert relic.count(old_tick) == 1
          relic = relic.replace(old_tick, new_tick)
          relic, count = re.subn(
              r'        internal static void RepairFromMcm\(\).*?        private static string DescribeItem',
              repair_block,
              relic,
              flags=re.S)
          assert count == 1, 'repair implementation was not replaced exactly once'

          expected = {
              'relic.00': '93d144dc09f73b970961b2a6db0a377378aaf66c995bac8c3c105801468b1d69',
              'relic.01': '60ef8b4c93c975372dde29126c32e6cc07fa93ceb018ccd5498435b1ad948aff',
              'relic.02': '0c861dd302098c95c6051e95cd35db0bf12aff8ef00789187eb28605d1f29610',
              'relic.03': '48e20727fe6c5aca960b641d7418bb224ec246462fb2ed7184e39782532d62f4',
              'relic.04': 'd30d74a9f295f8951b4ad8226ecba58f12e94bb6e853726b8b94c128769ce8cc',
              'relic.05': 'd005d529b43d1d711b09b7cceee5bf50e10c65d925b1999e99f0b6328eca1aca',
              'relic.06': 'c1e3747c2b79525a16d3fe56e99c4810b4e206c0e531a639ded0d113dc6765f9',
              'relic.07': 'c17562bf61d0dcdc9af3e42d71bc49c818db536a517ff1574ea93a300b650e4c',
              'relic.08': 'a4a3916a91f7e57506a7a17b9d04d96d4651ba1c33d11011ec16cd5065836ec4',
              'relic.09': 'd96e38eb53b5a36fd7a4e1a7cfb871e45bf0e72056d22cc7d84f5bce939e5ea0',
              'relic.10': '8148e79ddfa619ef7d185fcb2225bdc2d0d8a92ca2a9fd1762f0883017e92f7d',
              'relic.11': '3f44cebce951a24227bf0284f64e3557c2f1fd01c7a4236ae82707c89b4b77bf',
          }
          mismatches = []
          for name, wanted in expected.items():
              path = pathlib.Path('.patch') / name
              actual = '<missing>' if not path.exists() else hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != wanted:
                  mismatches.append(name + '=' + actual)
          if mismatches:
              raise RuntimeError('Chunk hash mismatch: ' + '; '.join(mismatches))
          raise RuntimeError('All chunk hashes match; diagnostic stop.')
      - name: Commit corrected implementation
        shell: bash
        run: |
          exit 1
