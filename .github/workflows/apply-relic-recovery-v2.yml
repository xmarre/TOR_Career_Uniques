name: Cleanup recovery patch blob

on:
  push:
    branches:
      - fix/relic-reward-inventory-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply bounded source corrections
        shell: python
        run: |
          import pathlib
          import re
          import subprocess

          audit_class = (
              "        private sealed class PendingGrantAudit\n"
              "        {\n"
              "        }\n")
          occurrence_class = audit_class
          old_tick = (
              "                if (restored)\n"
              "                {\n"
              "                }\n"
              "                else if (audit.Attempts >= 3)")
          new_tick = old_tick
          relic = audit_class + old_tick
          assert relic.count(audit_class) == 1
          relic = relic.replace(audit_class, occurrence_class)
          assert relic.count(old_tick) == 1
          relic = relic.replace(old_tick, new_tick)

          path = 'src/TORCareerUniques/CompanionSetLiveReconcile.cs'
          raw = subprocess.check_output(['git', 'show', 'origin/main:' + path])
          blob = subprocess.check_output(
              ['git', 'hash-object', '-w', '--stdin'], input=raw
          ).decode().strip()
          subprocess.run(
              ['git', 'update-index', '--cacheinfo', '100644', blob, path],
              check=True)
          pathlib.Path(path).write_bytes(raw)
          pathlib.Path('.github/workflows/apply-relic-recovery-v2.yml').unlink()
      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/apply-relic-recovery-v2.yml
          git commit -m "Restore untouched companion reconciliation blob"
          git push origin HEAD:fix/relic-reward-inventory-integrity
