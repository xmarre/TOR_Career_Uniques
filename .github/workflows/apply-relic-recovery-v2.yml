name: Apply relic recovery correction

on:
  push:
    branches:
      - fix/relic-reward-inventory-integrity
    paths:
      - .github/workflows/apply-relic-recovery-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/relic-reward-inventory-integrity
          fetch-depth: 0
      - name: Apply bounded source corrections
        shell: python
        run: |
          import hashlib
          import pathlib
          import re

          root = pathlib.Path('.')
          relic_path = root / 'src/TORCareerUniques/RelicRewardIntegrity.cs'
          mod_path = root / 'src/TORCareerUniques/ModInfrastructure.cs'
          workflow_path = root / '.github/workflows/apply-relic-recovery-v2.yml'

          relic = relic_path.read_text(encoding='utf-8')
          mod = mod_path.read_text(encoding='utf-8')

          for line in (
              'using MCM.Abstractions.Attributes;\n',
              'using MCM.Abstractions.Attributes.v2;\n',
              'using MCM.Abstractions.Base.Global;\n'):
              relic = relic.replace(line, '')

          relic, count = re.subn(
              r'\n    public sealed class RelicRewardRecoverySettings :.*?\n    }\n\n    internal static class RelicRewardIntegrity',
              '\n    internal static class RelicRewardIntegrity',
              relic,
              flags=re.S)
          assert count == 1, 'separate recovery MCM class was not removed exactly once'

          relic = relic.replace(
              '''        private enum OwnershipState
        {
            Unknown,
            NotOwned,
            Owned
        }

''', '')

          audit_class = '''        private sealed class PendingGrantAudit
        {
            internal ItemObject Item;
            internal ItemModifier Modifier;
            internal int ExpectedCount;
            internal string CareerId;
            internal float Delay;
            internal int Attempts;
        }
'''
          occurrence_class = audit_class + '''
        private sealed class RelicOccurrence
        {
            internal ItemObject Item;
            internal ItemModifier Modifier;
            internal ItemRoster Roster;
            internal EquipmentElement Element;
            internal int Amount;
            internal string Location;
            internal bool IsMainRoster;
            internal bool IsEquipment;
        }
'''
          assert relic.count(audit_class) == 1
          relic = relic.replace(audit_class, occurrence_class)

          old_tick = '''                if (restored)
                {
                    ModLog.AlwaysInfo("Post-loot ownership audit restored '" +
                        DescribeItem(audit.Item, audit.Modifier) + "'" +
                        (String.IsNullOrEmpty(source) ? String.Empty :
                            " after reclaiming it from " + source) +
                        ". Recovery state remains valid.");
                    PendingAudits.RemoveAt(i);
                }
'''
          new_tick = '''                if (restored)
                {
                    if (String.IsNullOrEmpty(source))
                    {
                        ModLog.AlwaysInfo("Post-loot ownership audit restored '" +
                            DescribeItem(audit.Item, audit.Modifier) +
                            "' after the transaction boundary deleted it. " +
                            "Recovery state remains valid.");
                    }
                    else
                    {
                        ModLog.AlwaysInfo("Post-loot ownership audit found '" +
                            DescribeItem(audit.Item, audit.Modifier) + "' at " +
                            source + ". No item was moved or duplicated.");
                    }
                    PendingAudits.RemoveAt(i);
                }
'''
          assert relic.count(old_tick) == 1
          relic = relic.replace(old_tick, new_tick)

          new_restore = '''        private static bool RestoreAuditedGrant(PendingGrantAudit audit,
            out string source)
        {
            source = null;
            if (audit == null || audit.Item == null ||
                MobileParty.MainParty == null ||
                MobileParty.MainParty.ItemRoster == null)
                return false;

            bool scanComplete;
            string existingLocation;
            if (TryFindExactItemLocation(audit.Item, audit.Modifier,
                out scanComplete, out existingLocation))
            {
                source = existingLocation;
                return true;
            }
            if (!scanComplete)
                return false;

            string error;
            bool added;
            _restoring = true;
            try
            {
                added = CareerUniqueRuntime.AddToRoster(
                    MobileParty.MainParty.ItemRoster, audit.Item,
                    audit.Modifier, 1, out error);
            }
            finally
            {
                _restoring = false;
            }
            if (!added)
            {
                ModLog.Error("Could not restore post-battle relic: " +
                    (error ?? "inventory insertion failed") + ".");
                return false;
            }

            bool supported;
            int current = CountExactStack(
                MobileParty.MainParty.ItemRoster, audit.Item,
                audit.Modifier, out supported);
            return supported && current >= audit.ExpectedCount;
        }

        private static bool TryFindExactStack'''
          relic, count = re.subn(
              r'        private static bool RestoreAuditedGrant\(PendingGrantAudit audit,.*?        private static bool TryFindExactStack',
              new_restore,
              relic,
              flags=re.S)
          assert count == 1, 'audited restore block was not replaced exactly once'

          repair_block = r'''        internal static void RepairFromMcm()
        {
            string result = RepairOrphanedRelicRewards(
                new List<string>());
            InquiryHelper.ShowMessage("Relic Reward Recovery", result);
        }

        [CommandLineFunctionality.CommandLineArgumentFunction(
            "repair_orphaned_relic_rewards", "torcu")]
        public static string RepairOrphanedRelicRewards(
            List<string> arguments)
        {
            if (Campaign.Current == null || MobileParty.MainParty == null ||
                MobileParty.MainParty.ItemRoster == null)
            {
                return "No campaign with a player inventory is currently " +
                    "loaded.";
            }

            List<string> repaired = new List<string>();
            List<string> preserved = new List<string>();
            List<string> cleaned = new List<string>();
            List<string> failed = new List<string>();
            string[] careers = SetItemRuntime.GetCareerIds();
            for (int i = 0; i < careers.Length; i++)
            {
                string careerId = careers[i];
                if (!AdminBridge.HasDiscoveredSetPiece(careerId, 0))
                    continue;

                List<RelicOccurrence> occurrences;
                string scanError;
                if (!TryScanRelicOccurrences(careerId, out occurrences,
                    out scanError))
                {
                    failed.Add(careerId + ": " + scanError);
                    continue;
                }

                string cleanedName;
                if (TryRemovePreviousRecoveryDuplicate(careerId, occurrences,
                    out cleanedName))
                {
                    cleaned.Add(cleanedName);
                    if (!TryScanRelicOccurrences(careerId, out occurrences,
                        out scanError))
                    {
                        failed.Add(careerId + ": post-cleanup scan failed: " +
                            scanError);
                        continue;
                    }
                }

                if (occurrences.Count > 0)
                {
                    preserved.Add(CareerUniqueRuntime.GetItemName(careerId) +
                        " already exists at " +
                        FormatOccurrenceLocations(occurrences));
                    continue;
                }

                string restoredName;
                string source;
                string restoreError;
                if (TryRestoreMissingRelic(careerId, out restoredName,
                    out source, out restoreError))
                {
                    repaired.Add(restoredName + " (" + source + ")");
                }
                else
                {
                    failed.Add(careerId + ": " + restoreError);
                }
            }

            SetItemRuntime.Tick();
            List<string> sections = new List<string>();
            if (cleaned.Count > 0)
            {
                sections.Add("Removed duplicate(s) created by the previous faulty " +
                    "recovery build: " + String.Join(", ", cleaned.ToArray()) +
                    ". The original copies were left on their existing characters.");
            }
            if (repaired.Count > 0)
            {
                sections.Add("Restored genuinely missing recovered relic(s): " +
                    String.Join(", ", repaired.ToArray()) + ".");
            }
            if (preserved.Count > 0)
            {
                sections.Add("Existing relics were not moved or duplicated: " +
                    String.Join("; ", preserved.ToArray()) + ".");
            }
            if (failed.Count > 0)
            {
                sections.Add("Could not safely repair: " +
                    String.Join("; ", failed.ToArray()) + ".");
            }
            if (sections.Count == 0)
            {
                sections.Add("No recovered relic required repair.");
            }

            string result = String.Join("\n\n", sections.ToArray());
            ModLog.AlwaysInfo(result.Replace("\n", " "));
            return result;
        }

        private static bool TryRemovePreviousRecoveryDuplicate(
            string careerId, List<RelicOccurrence> occurrences,
            out string removedName)
        {
            removedName = null;
            if (occurrences == null ||
                AdminBridge.GetDiscoveredSetPieceCount(careerId) >= 5)
                return false;

            RelicOccurrence main = null;
            int mainCount = 0;
            bool existsOutsideMain = false;
            for (int i = 0; i < occurrences.Count; i++)
            {
                RelicOccurrence occurrence = occurrences[i];
                if (occurrence.IsMainRoster)
                {
                    mainCount += Math.Max(0, occurrence.Amount);
                    if (main == null)
                        main = occurrence;
                }
                else
                {
                    existsOutsideMain = true;
                }
            }

            // Before 5/5, the normal reward selector never grants a duplicate piece.
            // The previous faulty recovery build is the only supported path that can
            // leave exactly one extra real relic in the active main inventory while
            // the original still exists on another character or storage owner.
            if (!existsOutsideMain || mainCount != 1 || main == null ||
                main.Roster == null || main.Amount != 1)
                return false;

            try
            {
                main.Roster.AddToCounts(main.Element, -1);
                removedName = DescribeItem(main.Item, main.Modifier);
                ModLog.AlwaysInfo("Removed erroneous prior recovery duplicate '" +
                    removedName + "' from the active main inventory; the existing " +
                    "copy at " + FirstExternalLocation(occurrences) +
                    " was left untouched.");
                return true;
            }
            catch (Exception ex)
            {
                ModLog.Error("Could not remove prior recovery duplicate for " +
                    careerId + ": " + ex.GetType().Name + ": " + ex.Message);
                return false;
            }
        }

        private static string FirstExternalLocation(
            List<RelicOccurrence> occurrences)
        {
            for (int i = 0; i < occurrences.Count; i++)
            {
                if (!occurrences[i].IsMainRoster)
                    return occurrences[i].Location;
            }
            return "another owner";
        }

        private static bool TryRestoreMissingRelic(string careerId,
            out string restoredName, out string source, out string error)
        {
            restoredName = CareerUniqueRuntime.GetItemName(careerId);
            source = null;
            error = null;

            ItemObject saved = FindSavedRelicItem(careerId);
            if (saved != null)
            {
                ItemModifier modifier =
                    CareerUniqueRuntime.RollLootModifier(saved) as ItemModifier;
                bool added;
                _restoring = true;
                try
                {
                    added = CareerUniqueRuntime.AddToRoster(
                        MobileParty.MainParty.ItemRoster, saved, modifier, 1,
                        out error);
                }
                finally
                {
                    _restoring = false;
                }
                if (!added)
                    return false;
                restoredName = DescribeItem(saved, modifier);
                source = "restored from TOR's saved relic record";
            }
            else
            {
                bool granted;
                _restoring = true;
                try
                {
                    granted = CareerUniqueRuntime.TryGrantCareerItemWithLootModifier(
                        careerId, out restoredName, out error);
                }
                finally
                {
                    _restoring = false;
                }
                if (!granted)
                    return false;
                source = "recreated because the old saved runtime record was missing";
            }

            List<RelicOccurrence> verification;
            string scanError;
            if (!TryScanRelicOccurrences(careerId, out verification,
                out scanError))
            {
                error = "post-restore ownership verification failed: " + scanError;
                return false;
            }
            for (int i = 0; i < verification.Count; i++)
            {
                if (verification[i].IsMainRoster)
                    return true;
            }
            error = "the restored relic was not retained in the active main inventory";
            return false;
        }

        private static ItemObject FindSavedRelicItem(string careerId)
        {
            object artisan = CareerUniqueRuntime.GetArtisanBehavior();
            IDictionary crafted = artisan == null ? null :
                AccessTools.Field(artisan.GetType(), "_customCraftedItems")
                    ?.GetValue(artisan) as IDictionary;
            if (crafted == null)
                return null;

            foreach (DictionaryEntry entry in crafted)
            {
                ItemObject item = entry.Key as ItemObject;
                string foundCareer;
                if (item != null &&
                    TryGetRealRelicCareer(item, entry.Value, out foundCareer) &&
                    String.Equals(foundCareer, careerId,
                        StringComparison.OrdinalIgnoreCase))
                    return item;
            }
            return null;
        }

        private static bool TryScanRelicOccurrences(string careerId,
            out List<RelicOccurrence> occurrences, out string error)
        {
            occurrences = new List<RelicOccurrence>();
            error = null;
            if (String.IsNullOrEmpty(careerId))
            {
                error = "career id is empty";
                return false;
            }

            try
            {
                HashSet<ItemRoster> visitedRosters = new HashSet<ItemRoster>();
                ItemRoster mainRoster = MobileParty.MainParty == null ? null :
                    MobileParty.MainParty.ItemRoster;
                AddRosterOccurrences(mainRoster, "active main inventory",
                    true, careerId, occurrences, visitedRosters);

                foreach (MobileParty party in MobileParty.All)
                {
                    if (party == null || party.ItemRoster == null)
                        continue;
                    string partyName = party.Name == null ? party.StringId :
                        party.Name.ToString();
                    AddRosterOccurrences(party.ItemRoster,
                        "party " + partyName + " (" +
                        (party.StringId ?? "<no-id>") + ")",
                        Object.ReferenceEquals(party.ItemRoster, mainRoster),
                        careerId, occurrences, visitedRosters);
                }

                foreach (Settlement settlement in Settlement.All)
                {
                    if (settlement == null)
                        continue;
                    string settlementName = settlement.Name == null ?
                        settlement.StringId : settlement.Name.ToString();
                    AddRosterOccurrences(settlement.ItemRoster,
                        "settlement inventory at " + settlementName,
                        false, careerId, occurrences, visitedRosters);
                    AddRosterOccurrences(settlement.Stash,
                        "stash at " + settlementName,
                        false, careerId, occurrences, visitedRosters);
                    AddRosterOccurrences(settlement.Party == null ? null :
                        settlement.Party.ItemRoster,
                        "settlement party inventory at " + settlementName,
                        false, careerId, occurrences, visitedRosters);
                }

                IEnumerable heroes;
                if (!TryGetAllAliveHeroes(out heroes))
                {
                    error = "Bannerlord's complete living-hero registry could not " +
                        "be read; repair was aborted to avoid duplicating a relic on " +
                        "another playable character.";
                    return false;
                }

                HashSet<Hero> visitedHeroes = new HashSet<Hero>();
                if (Hero.MainHero != null)
                    visitedHeroes.Add(Hero.MainHero);
                foreach (object value in heroes)
                {
                    Hero hero = value as Hero;
                    if (hero != null)
                        visitedHeroes.Add(hero);
                }
                foreach (Hero hero in visitedHeroes)
                {
                    string heroName = hero.Name == null ? hero.StringId :
                        hero.Name.ToString();
                    if (!AddEquipmentOccurrences(hero.BattleEquipment,
                        heroName + " battle equipment", careerId, occurrences) ||
                        !AddEquipmentOccurrences(hero.CivilianEquipment,
                        heroName + " civilian equipment", careerId, occurrences))
                    {
                        error = "equipment for " + heroName +
                            " could not be scanned; repair was aborted to avoid a " +
                            "duplicate.";
                        return false;
                    }
                }
                return true;
            }
            catch (Exception ex)
            {
                error = ex.GetType().Name + ": " + ex.Message;
                ModLog.Error("World-wide relic ownership scan failed for " +
                    careerId + ": " + error);
                return false;
            }
        }

        private static void AddRosterOccurrences(ItemRoster roster,
            string location, bool isMainRoster, string careerId,
            List<RelicOccurrence> occurrences,
            HashSet<ItemRoster> visitedRosters)
        {
            if (roster == null || !visitedRosters.Add(roster))
                return;
            foreach (ItemRosterElement rosterElement in roster)
            {
                if (rosterElement.Amount <= 0)
                    continue;
                EquipmentElement element = rosterElement.EquipmentElement;
                ItemObject item = element.Item;
                string foundCareer;
                if (item == null ||
                    !TryGetRelicCareerFromAnyItem(item, out foundCareer) ||
                    !String.Equals(foundCareer, careerId,
                        StringComparison.OrdinalIgnoreCase))
                    continue;
                occurrences.Add(new RelicOccurrence
                {
                    Item = item,
                    Modifier = element.ItemModifier,
                    Roster = roster,
                    Element = element,
                    Amount = rosterElement.Amount,
                    Location = location,
                    IsMainRoster = isMainRoster,
                    IsEquipment = false
                });
            }
        }

        private static bool AddEquipmentOccurrences(object equipment,
            string location, string careerId,
            List<RelicOccurrence> occurrences)
        {
            if (equipment == null)
                return true;
            IEnumerable elements;
            if (!TryEnumerateEquipmentElements(equipment, out elements))
                return false;
            foreach (object value in elements)
            {
                ItemObject item = GetProperty(value, "Item") as ItemObject;
                string foundCareer;
                if (item == null ||
                    !TryGetRelicCareerFromAnyItem(item, out foundCareer) ||
                    !String.Equals(foundCareer, careerId,
                        StringComparison.OrdinalIgnoreCase))
                    continue;
                occurrences.Add(new RelicOccurrence
                {
                    Item = item,
                    Modifier = GetProperty(value, "ItemModifier") as ItemModifier,
                    Roster = null,
                    Element = default(EquipmentElement),
                    Amount = 1,
                    Location = location,
                    IsMainRoster = false,
                    IsEquipment = true
                });
            }
            return true;
        }

        private static bool TryGetRelicCareerFromAnyItem(ItemObject item,
            out string careerId)
        {
            careerId = null;
            if (item == null)
                return false;
            string itemName = item.Name == null ? String.Empty :
                item.Name.ToString();
            if (itemName.StartsWith("[ADMIN COPY]",
                StringComparison.OrdinalIgnoreCase))
                return false;

            try
            {
                MethodInfo getTraits = AccessTools.Method(
                    typeof(SetItemRuntime), "GetItemTraits",
                    new[] { typeof(string) });
                IList traits = getTraits == null ? null :
                    getTraits.Invoke(null, new object[] { item.StringId }) as IList;
                if (traits == null)
                    return TryGetRealRelicCareer(item, out careerId);
                if (ContainsPrefix(traits, "torcu_admin_") ||
                    ContainsPrefix(traits, "torcu_hero_"))
                    return false;

                MethodInfo findSignature = AccessTools.Method(
                    typeof(SetItemRuntime), "FindPieceSignature",
                    new[] { typeof(IList) });
                object signature = findSignature == null ? null :
                    findSignature.Invoke(null, new object[] { traits });
                if (signature == null)
                    return false;
                object rawIndex = GetField(signature, "PieceIndex") ??
                    GetProperty(signature, "PieceIndex");
                if (rawIndex == null || Convert.ToInt32(rawIndex) != 0)
                    return false;
                object definition = GetField(signature, "Definition") ??
                    GetProperty(signature, "Definition");
                careerId = Convert.ToString(
                    GetField(definition, "CareerId") ??
                    GetProperty(definition, "CareerId"));
                return !String.IsNullOrEmpty(careerId);
            }
            catch (Exception ex)
            {
                ModLog.Error("Could not inspect relic signature for '" +
                    (String.IsNullOrEmpty(itemName) ? item.StringId : itemName) +
                    "': " + ex.GetType().Name + ": " + ex.Message);
                return false;
            }
        }

        private static bool TryGetRealRelicCareer(ItemObject item,
            out string careerId)
        {
            careerId = null;
            object artisan = CareerUniqueRuntime.GetArtisanBehavior();
            IDictionary crafted = artisan == null ? null :
                AccessTools.Field(artisan.GetType(), "_customCraftedItems")
                    ?.GetValue(artisan) as IDictionary;
            if (crafted == null || item == null || !crafted.Contains(item))
                return false;
            return TryGetRealRelicCareer(item, crafted[item], out careerId);
        }

        private static bool TryGetRealRelicCareer(ItemObject item,
            object saveData, out string careerId)
        {
            careerId = null;
            IList traits = GetProperty(saveData, "ItemTraits") as IList ??
                GetField(saveData, "ItemTraits") as IList;
            string itemName = item == null || item.Name == null ?
                String.Empty : item.Name.ToString();
            if (item == null || traits == null ||
                ContainsPrefix(traits, "torcu_admin_") ||
                ContainsPrefix(traits, "torcu_hero_") ||
                itemName.StartsWith("[ADMIN COPY]",
                    StringComparison.OrdinalIgnoreCase))
                return false;

            MethodInfo findSignature = AccessTools.Method(
                typeof(SetItemRuntime), "FindPieceSignature",
                new[] { typeof(IList) });
            if (findSignature == null)
                return false;
            try
            {
                object signature = findSignature.Invoke(null,
                    new object[] { traits });
                if (signature == null)
                    return false;
                object rawIndex = GetField(signature, "PieceIndex") ??
                    GetProperty(signature, "PieceIndex");
                if (rawIndex == null || Convert.ToInt32(rawIndex) != 0)
                    return false;
                object definition = GetField(signature, "Definition") ??
                    GetProperty(signature, "Definition");
                careerId = Convert.ToString(
                    GetField(definition, "CareerId") ??
                    GetProperty(definition, "CareerId"));
                return !String.IsNullOrEmpty(careerId);
            }
            catch (Exception ex)
            {
                ModLog.Error("Skipped malformed saved relic signature for '" +
                    (String.IsNullOrEmpty(itemName) ? item.StringId : itemName) +
                    "': " + ex.GetType().Name + ": " + ex.Message);
                return false;
            }
        }

        private static bool TryGetAllAliveHeroes(out IEnumerable heroes)
        {
            heroes = null;
            try
            {
                PropertyInfo property = typeof(Hero).GetProperty(
                    "AllAliveHeroes", BindingFlags.Public |
                    BindingFlags.NonPublic | BindingFlags.Static);
                if (property == null)
                    return false;
                heroes = property.GetValue(null, null) as IEnumerable;
                return heroes != null;
            }
            catch (Exception ex)
            {
                ModLog.Error("Living-hero registry scan failed: " +
                    ex.GetType().Name + ": " + ex.Message);
                return false;
            }
        }

        private static bool TryEnumerateEquipmentElements(object equipment,
            out IEnumerable elements)
        {
            elements = null;
            try
            {
                MethodInfo enumerate = AccessTools.Method(
                    typeof(SetItemRuntime), "EnumerateEquipmentElements",
                    new[] { typeof(object) });
                if (enumerate == null)
                    return false;
                elements = enumerate.Invoke(null,
                    new object[] { equipment }) as IEnumerable;
                return elements != null;
            }
            catch (Exception ex)
            {
                ModLog.Error("Equipment enumeration failed during relic scan: " +
                    ex.GetType().Name + ": " + ex.Message);
                return false;
            }
        }

        private static bool TryFindExactItemLocation(ItemObject item,
            ItemModifier modifier, out bool scanComplete, out string location)
        {
            scanComplete = false;
            location = null;
            if (item == null)
                return false;
            try
            {
                ItemRoster mainRoster = MobileParty.MainParty == null ? null :
                    MobileParty.MainParty.ItemRoster;
                HashSet<ItemRoster> visited = new HashSet<ItemRoster>();
                if (mainRoster != null)
                    visited.Add(mainRoster);

                foreach (MobileParty party in MobileParty.All)
                {
                    if (party == null || party.ItemRoster == null ||
                        !visited.Add(party.ItemRoster))
                        continue;
                    EquipmentElement found;
                    if (!TryFindExactStack(party.ItemRoster, item, modifier,
                        out found))
                        continue;
                    location = "party " +
                        (party.Name == null ? party.StringId :
                            party.Name.ToString()) + " (" +
                        (party.StringId ?? "<no-id>") + ")";
                    scanComplete = true;
                    return true;
                }

                foreach (Settlement settlement in Settlement.All)
                {
                    if (settlement == null)
                        continue;
                    ItemRoster[] rosters = new[]
                    {
                        settlement.ItemRoster,
                        settlement.Stash,
                        settlement.Party == null ? null :
                            settlement.Party.ItemRoster
                    };
                    string settlementName = settlement.Name == null ?
                        settlement.StringId : settlement.Name.ToString();
                    for (int r = 0; r < rosters.Length; r++)
                    {
                        if (rosters[r] == null || !visited.Add(rosters[r]))
                            continue;
                        EquipmentElement found;
                        if (TryFindExactStack(rosters[r], item, modifier,
                            out found))
                        {
                            location = settlementName + " storage";
                            scanComplete = true;
                            return true;
                        }
                    }
                }

                IEnumerable heroes;
                if (!TryGetAllAliveHeroes(out heroes))
                    return false;
                foreach (object value in heroes)
                {
                    Hero hero = value as Hero;
                    if (hero == null)
                        continue;
                    object[] equipment =
                    {
                        hero.BattleEquipment,
                        hero.CivilianEquipment
                    };
                    for (int e = 0; e < equipment.Length; e++)
                    {
                        IEnumerable elements;
                        if (!TryEnumerateEquipmentElements(equipment[e],
                            out elements))
                            return false;
                        foreach (object element in elements)
                        {
                            if (Object.ReferenceEquals(
                                    GetProperty(element, "Item"), item) &&
                                Object.ReferenceEquals(
                                    GetProperty(element, "ItemModifier"),
                                    modifier))
                            {
                                location = (hero.Name == null ? hero.StringId :
                                    hero.Name.ToString()) +
                                    (e == 0 ? " battle equipment" :
                                        " civilian equipment");
                                scanComplete = true;
                                return true;
                            }
                        }
                    }
                }
                scanComplete = true;
                return false;
            }
            catch (Exception ex)
            {
                ModLog.Error("Exact relic ownership scan failed: " +
                    ex.GetType().Name + ": " + ex.Message);
                return false;
            }
        }

        private static string FormatOccurrenceLocations(
            List<RelicOccurrence> occurrences)
        {
            HashSet<string> unique = new HashSet<string>(
                StringComparer.OrdinalIgnoreCase);
            List<string> locations = new List<string>();
            for (int i = 0; i < occurrences.Count; i++)
            {
                string location = occurrences[i].Location ?? "unknown location";
                if (unique.Add(location))
                    locations.Add(location);
                if (locations.Count >= 4)
                    break;
            }
            return String.Join(", ", locations.ToArray());
        }

        private static string DescribeItem'''

          relic, count = re.subn(
              r'        internal static void RepairFromMcm\(\).*?        private static string DescribeItem',
              repair_block,
              relic,
              flags=re.S)
          assert count == 1, 'repair implementation was not replaced exactly once'

          assert mod.count('public override int UIVersion { get { return 10; } }') == 1
          mod = mod.replace(
              'public override int UIVersion { get { return 10; } }',
              'public override int UIVersion { get { return 11; } }')

          old_actions = '''        private static readonly Action RespawnMissingAction =
            AdminBridge.RespawnMissing;
'''
          new_actions = old_actions + '''        private static readonly Action RepairMissingRecoveredRelicsAction =
            RelicRewardIntegrity.RepairFromMcm;
'''
          assert mod.count(old_actions) == 1
          mod = mod.replace(old_actions, new_actions)

          respawn_button = '''        [SettingPropertyButton("Respawn missing encounters", 20, false,
            "Clears cooldowns and immediately recreates every currently missing encounter. Recovered set pieces remain recovered.", Content = "Respawn now")]
'''
          recovery_button = '''        [SettingPropertyButton("Repair missing recovered relics", 19, false,
            "Scans every living character, hero equipment set, mobile-party inventory, settlement inventory and stash before restoring anything. Existing relics are never moved. It also removes the single duplicate that the previous faulty recovery build could place in the active main inventory while the original remained on another character.", Content = "Repair now")]
        [SettingPropertyGroup("Relic Encounters & Testing", GroupOrder = 2)]
        public Action RepairMissingRecoveredRelics
        {
            get { return RepairMissingRecoveredRelicsAction; }
            set { }
        }

'''
          assert mod.count(respawn_button) == 1
          mod = mod.replace(respawn_button, recovery_button + respawn_button)

          relic_path.write_text(relic, encoding='utf-8', newline='\n')
          mod_path.write_text(mod, encoding='utf-8', newline='\n')
          workflow_path.unlink()

          manifest_path = root / 'SOURCE_MANIFEST.sha256'
          manifest = manifest_path.read_text(encoding='utf-8').splitlines()
          changed = {
              'src/TORCareerUniques/RelicRewardIntegrity.cs': relic_path,
              'src/TORCareerUniques/ModInfrastructure.cs': mod_path,
          }
          for rel, path in changed.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              matches = [i for i, line in enumerate(manifest)
                         if line.endswith('  ' + rel)]
              assert len(matches) == 1, f'manifest entry missing or duplicated: {rel}'
              manifest[matches[0]] = digest + '  ' + rel
          manifest_path.write_text('\n'.join(manifest) + '\n', encoding='utf-8')

