name: Import canonical source

on:
  push:
    branches: [repo-rebuild-v1.7.29]
    paths: ['.import/canonical/ready']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: repo-rebuild-v1.7.29
          fetch-depth: 0
      - name: Reconstruct and verify canonical tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find .import/canonical -maxdepth 1 -type f -name 'part-*.txt' | sort)
          test "${#chunks[@]}" -eq 19
          cat "${chunks[@]}" | base64 --decode > /tmp/TORCareerUniques-v1.7.29-canonical.tar.xz
          echo '40cddb5805a0bca7107d40abfc068187709e3a62a65a26a07b539753b31ddca5  /tmp/TORCareerUniques-v1.7.29-canonical.tar.xz' | sha256sum --check --strict
          xz --test /tmp/TORCareerUniques-v1.7.29-canonical.tar.xz

          rm -rf /tmp/torcu-source
          mkdir -p /tmp/torcu-source
          tar -xJf /tmp/TORCareerUniques-v1.7.29-canonical.tar.xz -C /tmp/torcu-source
          source_root=/tmp/torcu-source
          if [ ! -f "$source_root/TORCareerUniques.sln" ]; then
            mapfile -t roots < <(find /tmp/torcu-source -type f -name TORCareerUniques.sln -printf '%h\n')
            test "${#roots[@]}" -eq 1
            source_root="${roots[0]}"
          fi

          (
            cd "$source_root"
            sha256sum --check --strict SOURCE_MANIFEST.sha256
          )
          pwsh -NoProfile -File "$source_root/scripts/Verify-Source.ps1"

          if find "$source_root" -type f \( -iname 'VALIDATION*' -o -iname '*INVESTIGATION*' -o -iname '*PatchCompatibilityFixes*' -o -path '*/.import/*' -o -path '*/bootstrap*/*' \) -print -quit | grep -q .; then
            echo 'Forbidden cleanup artifact survived canonical import.' >&2
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root/." .
          test -f TORCareerUniques.sln
          test -f SOURCE_MANIFEST.sha256
          test -f src/TORCareerUniques/SetItemRuntime.cs
      - name: Commit canonical repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Rebuild repository from v1.7.28 and apply v1.7.29'
          git push origin HEAD:repo-rebuild-v1.7.29
